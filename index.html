<style>
:root{--bg:#f3f5f7;--card:#fff;--ink:#16202a;--mut:#5b6875;--pri:#0f3d5e;--acc:#e07a1f;--line:#dde3e8}

*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink);

header{background:#0f3d5e;color:#fff;padding:14px 16px 12px;display:flex;justify-content:space-between;align-items:center;gap:10px}.me{text-align:right;font-size:11px;line-height:1.35;opacity:.95}.me b{display:block;font-size:13px}.me span{display:block;opacity:.85}header h1{margin:0;font-size:18px}header p{margin:2px 0 0;font-size:12px;opacity:.8}

table{width:100%;border-collapse:collapse;font-size:14px}td{padding:5px 2px;border-top:1px solid var(--line)}td:last-child{text-align:right;font-weight:600;font-variant-numeric:tabular-nums}

.sm{font-size:12px;color:var(--mut)}

.xt td:last-child{text-align:left;font-weight:400}
.xt th{background:#0f3d5e;color:#fff;font-weight:600;white-space:normal;min-width:62px;max-width:96px;position:sticky;top:0;z-index:1}
.xt td.ty{font-weight:700;text-align:left}.xt tbody tr:nth-child(even){background:var(--bg)}
.xt .sk{position:sticky;z-index:2;background:var(--card)}
.xt tbody tr:nth-child(even) td.sk{background:var(--bg)}
.xt th.sk{z-index:3;background:#0f3d5e}
.xt .skl{box-shadow:3px 0 4px -2px rgba(0,0,0,.25)}
.xt td.ty{white-space:normal;min-width:70px;max-width:86px;line-height:1.2}
.xt th:nth-child(-n+5),.xt td:nth-child(-n+5){min-width:0;padding:5px 4px}

<header><div><h1>Drain Type Finder</h1><p>Dhaka–Sylhet Highway · DS-1</p></div><div class="me"><b>Md. Nasir Uddin</b><span>Civil Engineer</span><span>01919902255</span><button id="installBtn" hidden style="margin-top:6px;font-size:12px;padding:5px 9px;border:0;border-radius:6px;background:#e07a1f;color:#fff;font-weight:600">📲 Install</button></div></header>
<main>

], "Type 2c (Covered)": [2.25, 0.25, 0.25, 0.25, 2.25, 0.25], "Type 2d": [2.475, 0.3, 0.3, 0.175, null, null], "Type Burried": [3.1, 0.3, 0.3, 0.3, 3.1, 0.3], "Type 2f": [2.6, 0.3, 0.3, 0.3, 2.6, 0.3], "Type 2e": [2.525, 0.35, 0.35, 0.175, null, null], "Type 1aa": [1.6, 0.225, 0.225, 0.225, 1.6, 0.125], "Cross Road 1": [1.65, 0.25, 0.25, 0.25, 1.65, 0.2], "Cross Road 2f": [2.6, 0.3, 0.3, 0.3, 2.6, 0.3]}};
const L=["BASE RCC width (m)","Base RCC thk (m)","Wall inner RCC thk (m)","Wall outer RCC thk (m)","Top slab width (m)","Top slab thk (m)"];
const fmt=c=>{c=+c;const k=Math.floor(c/1000),m=c-k*1000;return k+"+"+(Math.round(m*100)/100).toString().padStart(3,"0")};
const parse=s=>{s=(s||"").trim().replace(/\s/g,"");if(!s)return null;if(s.includes("+")){const[a,b]=s.split("+");return(+a)*1000+(+b)}return +s};
const n=v=>v===null||v===undefined||v===""?"–":(+v).toFixed(3).replace(/0+$/,"").replace(/\.$/,"");
let side="R/S",lside="All";
const SL=["RCC W","Base t","Wall in","Wall out","Slab W","Slab t"];
function details(type){const t=D.types[type];if(!t)return"<div class='sm'>No drain</div>";
 const v=[["BFS",t[0]+0.1],["CC",t[0]+0.1]].concat(SL.map((l,i)=>[l,t[i]])).filter(x=>x[1]!==null&&x[1]!=="");
 return "<div class='g'>"+v.map(x=>"<div><b>"+n(x[1])+"</b><span>"+x[0]+"</span></div>").join("")+"</div>"}
function card(r){const[f,t,s,ty,ref,rem]=r;return "<div class='card res'><div class='hd'><b>"+ty+"</b><span>"+s+" · "+fmt(f)+"–"+fmt(t)+"</span></div>"+details(ty)+
 ((ref!==""||rem)?"<div class='ft'>"+(ref!==""?"Dwg "+ref:"")+(rem?(ref!==""?" · ":"")+rem:"")+"</div>":"")+"</div>"}
const HD=["Sl. No","From","-","To","Side","Drain Type","BASE BFS (m)","BASE CC (m)","BASE RCC (m)","BASE RCC (Tic._m)","Vertical Wall Inner RCC (Tic._m)","Vertical Wall Outer RCC (Tic_m)","Top Slab (W)","Top Slab (Tic._m)","Drwing Ref.","Remarks"];
const e=v=>v===null||v===undefined||v===""?"":n(v);
function xrow(r,i){const[f,to,s,ty,ref,rem]=r;const t=D.types[ty]||[];const rc=t.length?t[0]:"";
 const c=[i+1,f,"-",to,s,ty,rc===""?"":rc+0.1,rc===""?"":rc+0.1,rc,t[1],t[2],t[3],t[4],t[5],ref,rem];
 return "<tr>"+c.map((v,j)=>"<td"+(j==5?" class='ty'":"")+">"+(j==1||j==3?n(v):(j>=6&&j<=13?e(v):(v===null?"":v)))+"</td>").join("")+"</tr>"}
function xtable(m){return "<div class='xw'><table class='xt'><thead><tr>"+HD.map(h=>"<th>"+h+"</th>").join("")+"</tr></thead><tbody>"+m.map(xrow).join("")+"</tbody></table></div>"}
function stick(root){root.querySelectorAll("table.xt").forEach(tb=>{const hr=tb.tHead.rows[0];let left=0;
 for(let j=0;j<6;j++){const w=hr.cells[j].getBoundingClientRect().width;
  tb.querySelectorAll("tr").forEach(tr=>{const c=tr.cells[j];if(!c)return;c.classList.add("sk");c.style.left=left+"px";if(j==5)c.classList.add("skl")});left+=w}})}
function search(){const a=parse(f.value),bb=parse(t.value);const o=document.getElementById("out");
 try{localStorage.setItem("dtf",JSON.stringify([f.value,t.value,side]))}catch(e){}
 if(a===null||isNaN(a)){o.innerHTML="<div class='empty'>Enter a chainage to find the drain type.</div>";return}
 let lo=a,hi=(bb===null||isNaN(bb))?a:bb;if(lo>hi)[lo,hi]=[hi,lo];
 const m=D.rows.filter(r=>(side==="Both"||r[2]===side)&&r[0]<=hi&&r[1]>=lo).sort((x,y)=>x[2].localeCompare(y[2])||x[0]-y[0]);
 o.innerHTML=m.length?"<div class='card' style='padding:8px'>"+xtable(m)+"</div>":"<div class='empty'>No drain listed at "+fmt(lo)+(hi!==lo?" – "+fmt(hi):"")+" ("+side+").</div>";stick(o)}

function types(){tout.innerHTML=Object.keys(D.types).map(k=>"<div class='card res'><div class='hd'><b>"+k+"</b></div>"+details(k)+"</div>").join("")}
function setSeg(id,v){document.querySelectorAll("#"+id+" button").forEach(b=>b.classList.toggle("on",b.dataset.s===v))}

document.getElementById("lside").onclick=e=>{if(!e.target.dataset.s)return;lside=e.target.dataset.s;setSeg("lside",lside);list()};

 document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b.dataset.v===v));window.scrollTo(0,0);if(v==="list")stick(ltab);if(v==="search")stick(document.getElementById("out"))}
document.querySelector("nav").onclick=e=>{if(e.target.dataset.v)show(e.target.dataset.v)};

(function(){if(!('serviceWorker' in navigator)||!(location.protocol==='https:'||location.hostname==='localhost'))return;
